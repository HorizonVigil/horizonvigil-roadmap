name: Promotion Gate

on:
  pull_request:
    branches: [dev, test, main]

permissions:
  contents: read

jobs:
  promotion-gate:
    name: Promotion gate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev to test to main promotion
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          case "$BASE_BRANCH" in
            main)
              [ "$HEAD_BRANCH" = "test" ] || {
                echo "::error::Pull requests into main must come from test."
                exit 1
              }
              ;;
            test)
              [ "$HEAD_BRANCH" = "dev" ] || {
                echo "::error::Pull requests into test must come from dev."
                exit 1
              }
              ;;
            dev)
              ;;
            *)
              echo "::error::Unsupported target branch: $BASE_BRANCH"
              exit 1
              ;;
          esac
  repository-security:
    name: Repository security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Secret scan
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.0
          detect --source=/repo --redact --no-banner --verbose
      - name: Filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true